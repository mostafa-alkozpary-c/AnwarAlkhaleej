<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1329"/>
    </linearGradient>
    <linearGradient id="lightRay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Group: Icon Badge (Right side in RTL) -->
  <g transform="translate(450, 10)">
    <!-- Hexagonal / Shield Background Badge -->
    <path d="M70,5 L125,35 L125,105 L70,135 L15,105 L15,35 Z" 
          fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#shadow)"/>
    
    <!-- Light Burst Effect (أنوار) -->
    <circle cx="70" cy="40" r="18" fill="url(#goldGrad)" opacity="0.25" filter="url(#glow)"/>
    <path d="M70,18 L70,26 M70,54 L70,62 M48,40 L56,40 M84,40 L92,40 M54,24 L60,30 M86,24 L80,30 M54,56 L60,50 M86,56 L80,50" 
          stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Half Lorry Truck Silhouette -->
    <!-- Cargo Box / Tray -->
    <rect x="28" y="58" width="48" height="34" rx="3" fill="url(#goldGrad)"/>
    <!-- Cargo Details (Racks) -->
    <line x1="33" y1="58" x2="33" y2="70" stroke="#92400E" stroke-width="1.8"/>
    <line x1="48" y1="58" x2="48" y2="70" stroke="#92400E" stroke-width="1.8"/>
    <line x1="63" y1="58" x2="63" y2="70" stroke="#92400E" stroke-width="1.8"/>
    <line x1="28" y1="70" x2="76" y2="70" stroke="#92400E" stroke-width="1.8"/>

    <!-- Cabin (Facing Left) -->
    <path d="M76,66 L95,66 L106,78 L106,92 L76,92 Z" fill="#F8FAFC"/>
    <!-- Cabin Window -->
    <path d="M80,70 L93,70 L101,78 L80,78 Z" fill="#0284C7"/>
    <!-- Headlight Beam (أنوار الهاف لوري) -->
    <polygon points="106,85 124,79 124,93" fill="url(#lightRay)"/>

    <!-- Chassis & Wheels -->
    <rect x="30" y="91" width="75" height="4" fill="#334155"/>
    <!-- Back Wheel -->
    <circle cx="45" cy="94" r="9" fill="#0F172A" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="45" cy="94" r="4" fill="url(#goldGrad)"/>
    <!-- Front Wheel -->
    <circle cx="94" cy="94" r="9" fill="#0F172A" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="94" cy="94" r="4" fill="url(#goldGrad)"/>

    <!-- Dynamic Base Curves -->
    <path d="M25,115 Q70,126 115,115" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography / Brand Text -->
  <g text-anchor="end">
    <!-- Main Brand Name: أنوار الخليج -->
    <text x="430" y="72" font-family="'Cairo', 'Tajawal', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="44" fill="#0F172A">
      أنــوار <tspan fill="url(#goldGrad)">الـخـلـيـج</tspan>
    </text>

    <!-- Subtitle: هاف لوري لنقل العفش والأغراض -->
    <text x="430" y="108" font-family="'Cairo', 'Tajawal', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="19" fill="#475569" letter-spacing="0.5">
      هـاف لـوري نـقـل عـفـش وأغـراض وبـضـائـع
    </text>

    <!-- Tagline: في خدمتكم بجميع المناطق -->
    <text x="430" y="134" font-family="'Cairo', 'Tajawal', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="14" fill="#0284C7">
      ✦ خـدمـة مـتـمـيـزة فـي جـمـيـع الـمـنـاطـق ✦
    </text>
  </g>
</svg>
